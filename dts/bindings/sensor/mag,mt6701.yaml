description: |
  Sensor driver for the Magntek MT6701 14-bit magnetic angle sensor,
  accessed over I2C at 7-bit address 0x06.

compatible: "mag,mt6701"

include: [i2c-device.yaml]

properties:
  poll-period-ms:
    type: int
    default: 5
    description: Polling interval in milliseconds  max-backlog-degrees:
    type: int
    default: 15
    description: |
      Largest rotation, in degrees, allowed to sit unreported. Excess is discarded so a
      fast spin saturates the scroll rate rather than queueing a burst the ZMK behavior
      queue cannot drain. Keep at or below 360 / triggers-per-rotation.
  min-report-interval-ms:
    type: int
    default: 30
    description: |
      Shortest gap between sensor triggers handed to the keymap. Must stay above the
      sensor binding's tap-ms, which is how fast the ZMK behavior queue drains.
