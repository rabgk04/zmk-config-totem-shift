# left + right + macropad
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3

# ZMK_BLE_PROFILE_COUNT is BT_MAX_PAIRED - PERIPHERALS
# (zmk/include/zmk/ble.h), which partitions one fixed bond table, so a third
# peripheral takes a host profile with it: 4 -> 3 at the default
# BT_MAX_PAIRED=6. Raising it to 8 gives the third peripheral its bond without
# spending a profile, and leaves room for studio's own connection.
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_MAX_CONN=8

# The likelier cause of three peripherals thrashing where two were stable. ZMK
# bumps this to 5 for "concurrent GATT discovery of splits"
# (zmk/app/src/split/bluetooth/Kconfig) -- a flat value, not scaled by
# peripheral count, sized when two was the norm. Three concurrent discoveries
# plus three notification subscriptions share those same buffers, and the
# central stops scanning for the whole connect+discover of each peripheral, so
# a starved discovery stalls the entire chain. BT_CONN_TX_MAX tracks this by
# default; studio already forces it to 64.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

CONFIG_ZMK_SLEEP=n

