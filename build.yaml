include:
  - board: seeeduino_xiao_ble
    shield: totem_left rgbled_adapter
    artifact-name: totem_shift_left
  - board: seeeduino_xiao_ble
    shield: totem_right rgbled_adapter
    artifact-name: totem_shift_right
  - board: nice_nano_v2
    shield: totem_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: nicenano_prospector_dongle
  # Macropad is now a third split peripheral of the dongle, not a USB device.
  - board: nice_nano_v2
    shield: totem_macropad
    artifact-name: totem_macropad_peripheral
  # Peripheral count changed 2 -> 3, so every device needs its bonds cleared
  # and the whole set re-paired.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nicenano_reset_settings
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: xiao_reset_settings
